<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>One Way | شحن ونقل دولي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Playfair+Display:ital,wght@600;800;900&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b18;--bg2:#0a1630;--card:#0d1b3a;--line:#1b2f5e;--b:#1e90ff;--b2:#6cc4ff;--t:#eaf2ff;--m:#8ea3c7;--ok:#22c55e;--wr:#f59e0b;--er:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#050b18}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--t);font-family:Cairo,Tahoma,sans-serif;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;font-size:15px}
#intro{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 50%,#0b2a63,#030712);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:out .8s 3.4s forwards}
#intro .lg{animation:pop 1.6s cubic-bezier(.2,1.4,.4,1) both}
#intro p{margin-top:18px;letter-spacing:6px;color:var(--b2);animation:fade 1s 1.4s both;font-weight:600}
#intro .bar{width:200px;height:3px;background:#1b2f5e;margin-top:22px;border-radius:9px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--b2));animation:ld 2.8s .3s forwards}
@keyframes pop{from{transform:scale(.2) rotate(-25deg);opacity:0;filter:blur(14px)}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}@keyframes ld{to{width:100%}}@keyframes out{to{opacity:0;visibility:hidden}}
nav{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 5vw;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(5,11,24,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .l{display:flex;gap:22px;flex-wrap:wrap;color:var(--m)}nav .l a{color:inherit;text-decoration:none;font-weight:600}nav .l a:hover{color:var(--b2)}
.btn{border:0;cursor:pointer;border-radius:12px;padding:10px 20px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1e90ff,#0b57d0);box-shadow:0 8px 28px -8px #1e90ff;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px -8px #1e90ff}.btn.g{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--t)}.btn.s{padding:6px 12px;font-size:13px}.btn.ok{background:#16a34a;box-shadow:none}.btn.wr{background:#d97706;box-shadow:none}.btn.er{background:#dc2626;box-shadow:none}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px 6vw 80px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 10%,#103a85 0,transparent 55%),radial-gradient(ellipse at 10% 90%,#0a2a66 0,transparent 50%),var(--bg)}
.hero h1{font-size:clamp(34px,7vw,74px);font-weight:900;line-height:1.2;background:linear-gradient(120deg,#fff,#6cc4ff 60%,#1e90ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:fade 1s 3.6s both}
.hero p{max-width:640px;color:var(--m);margin:18px 0 28px;font-size:18px;animation:fade 1s 3.8s both}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;animation:fade 1s 4s both}
.hero .lg{animation:fl 5s ease-in-out infinite;margin-bottom:10px}
@keyframes fl{50%{transform:translateY(-12px)}}
.waves{position:absolute;bottom:0;inset-inline:0;height:130px;opacity:.9}.waves path{animation:wv 9s linear infinite}.waves path:nth-child(2){animation-duration:14s;opacity:.5}
@keyframes wv{to{transform:translateX(-600px)}}
.sh{position:absolute;bottom:70px;font-size:44px;animation:sail 22s linear infinite;inset-inline-start:-80px}@keyframes sail{to{inset-inline-start:110%}}
section{padding:80px 6vw}h2{font-size:34px;font-weight:900;margin-bottom:10px}h2 span{color:var(--b2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}
.card{background:linear-gradient(160deg,var(--card),#081226);border:1px solid var(--line);border-radius:18px;padding:22px;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--b);box-shadow:0 20px 50px -20px #1e90ff}
