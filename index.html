<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malek Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
<style>
:root{--bg:#05060f;--card:#0e1022;--line:#23264a;--tx:#eef0ff;--mut:#8a8fb8;--a:#7c5cff;--b:#00e5ff;--c:#ff3d8b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 20% 10%,#7c5cff33,transparent),radial-gradient(600px 400px at 85% 80%,#00e5ff22,transparent);pointer-events:none;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(30px,-20px) scale(1.1)}}
button{font:inherit;cursor:pointer;color:inherit}
/* INTRO */
#intro{position:fixed;inset:0;z-index:99;background:#02030a;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s,transform 1s}
#intro.out{opacity:0;transform:scale(1.4);pointer-events:none}
#c{position:absolute;inset:0;width:100%;height:100%}
.logo{position:relative;display:flex;direction:ltr;gap:.08em;font-size:clamp(48px,13vw,150px);font-weight:900;letter-spacing:.05em}
.logo span{opacity:0;transform:translateY(60px) rotateX(90deg) scale(.5);filter:blur(14px);background:linear-gradient(180deg,#fff,var(--b) 55%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;animation:in .9s cubic-bezier(.2,.9,.3,1.3) forwards,glow 2.4s 1.8s ease-in-out infinite alternate}
@keyframes in{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glow{to{filter:drop-shadow(0 0 22px var(--b))}}
.ring{position:absolute;width:min(70vw,520px);aspect-ratio:1;border-radius:50%;border:2px solid transparent;border-top-color:var(--b);border-bottom-color:var(--c);animation:spin 3s linear infinite;opacity:.55}
.ring.r2{width:min(55vw,400px);animation-duration:2s;animation-direction:reverse;border-top-color:var(--a);border-bottom-color:var(--b)}
@keyframes spin{to{transform:rotate(360deg)}}
.pw{position:relative;margin-top:28px;direction:ltr;letter-spacing:.5em;font-size:clamp(11px,2.4vw,20px);color:var(--mut);opacity:0;animation:fade 1s 1.6s forwards}
.pw b{color:#fff;text-shadow:0 0 14px var(--b)}
@keyframes fade{to{opacity:1;letter-spacing:.8em}}
.bar{position:relative;margin-top:34px;width:min(60vw,320px);height:3px;background:#ffffff18;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),var(--c));animation:load 4.6s ease-in-out forwards}
@keyframes load{to{width:100%}}
#skip{position:absolute;bottom:24px;left:24px;background:none;border:1px solid var(--line);padding:6px 14px;border-radius:99px;color:var(--mut)}
/* TOP BAR */
#top{display:none;position:sticky;top:0;z-index:5;gap:14px;align-items:center;padding:12px 20px;background:#05060fcc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .mini{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;direction:ltr}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 18px;transition:.3s}
.sb:focus-within{border-color:var(--b);box-shadow:0 0 0 4px #00e5ff22,0 0 40px #7c5cff33}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:17px;padding:10px 4px}
.sb button{background:linear-gradient(135deg,var(--a),var(--b));border:0;border-radius:99px;padding:10px 22px;font-weight:700;color:#05060f}
#top .sb{flex:1;max-width:720px}
/* VIEWS */
.v{display:none;position:relative;animation:up .5s}
.v.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
#home.on{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
.big{font-size:clamp(54px,12vw,120px);font-weight:900;direction:ltr;background:linear-gradient(90deg,var(--b),var(--a),var(--c),var(--b));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300%}}
.tag{color:var(--mut);margin:6px 0 30px}
#home .sb{width:min(720px,92vw)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px;max-width:720px}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 18px;transition:.25s}
.chips button:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 8px 28px #7c5cff44}
.badge{margin-top:30px;font-size:12px;color:#3ddc97}
.foot{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut);letter-spacing:.3em;direction:ltr}
.tabs{display:flex;gap:8px;padding:16px 20px 0}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 16px;color:var(--mut)}
.tabs button.on{color:var(--tx);border-color:var(--b)}
.wrap{padding:18px 20px 60px;max-width:1280px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.vc{cursor:pointer;animation:up .5s backwards}
.vc .th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--card);transition:.3s}
.vc:hover .th{transform:scale(1.03);box-shadow:0 10px 36px #7c5cff55}
.vc img{width:100%;height:100%;object-fit:cover}
.vc em{position:absolute;bottom:6px;left:6px;background:#000c;padding:2px 7px;border-radius:6px;font-size:12px;font-style:normal}
.vc h4{font-size:14px;margin:10px 0 3px;line-height:1.5}
.vc p{font-size:12px;color:var(--mut)}
.r{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;animation:up .4s backwards}
.r small{color:#3ddc97;direction:ltr;display:block;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r h3{color:#8fb4ff;margin:4px 0;font-size:18px}
.r:hover h3{text-decoration:underline}
.r p{color:var(--mut);font-size:14px;line-height:1.7}
.msg{text-align:center;color:var(--mut);padding:60px 0}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--b);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
#watch .wrap{display:grid;grid-template-columns:1fr 340px;gap:24px}
@media(max-width:900px){#watch .wrap{grid-template-columns:1fr}}
.pl{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 0 70px #7c5cff44}
.pl video,.pl iframe{width:100%;height:100%;border:0;display:block}
#wt{margin:14px 0 4px;font-size:20px}
.ok{color:#3ddc97;font-size:13px}
.rel .vc{display:flex;gap:10px;margin-bottom:12px}
.rel .vc .th{width:150px;flex:none}
.rel .vc h4{margin-top:0}
#site{height:calc(100vh - 62px)}
#site .bar2{display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
#site .bar2 button{background:#ffffff10;border:0;border-radius:10px;padding:7px 14px}
#su{flex:1;direction:ltr;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#site iframe{width:100%;height:calc(100% - 46px);border:0;background:#fff}
</style>
</head>
<body>

<div id="intro">
  <canvas id="c"></canvas>
  <div class="ring"></div><div class="ring r2"></div>
  <div class="logo" id="lg"></div>
  <div class="pw">POWERED BY <b>MALEK</b></div>
  <div class="bar"><i></i></div>
  <button id="skip">تخطّي ›</button>
</div>

<div id="top">
  <div class="mini" onclick="show('home')">MALEK</div>
  <div class="sb"><input id="q2" placeholder="ابحث أو اكتب اسم موقع…"><button onclick="go(q2.value)">بحث</button></div>
</div>

<section id="home" class="v on">
  <div class="big">MALEK</div>
  <div class="tag">ابحث · شاهد · تصفّح — كل ده جوه موقعك وبدون إعلانات</div>
  <div class="sb"><input id="q" placeholder="ابحث أو اكتب اسم موقع (يوتيوب، ويكيبيديا…)" autofocus><button onclick="go(q.value)">بحث</button></div>
  <div class="chips" id="chips"></div>
  <div class="badge">✓ حاجب إعلانات مدمج</div>
  <div class="foot">POWERED BY MALEK</div>
</section>

<section id="res" class="v">
  <div class="tabs"><button id="tw" class="on" onclick="tab('w')">🌐 الويب</button><button id="tv" onclick="tab('v')">▶ فيديو</button></div>
  <div class="wrap" id="rb"></div>
</section>

<section id="watch" class="v">
  <div class="wrap">
    <div><div class="pl" id="pl"></div><h2 id="wt"></h2><div class="ok">✓ بدون إعلانات</div><p id="wb" class="msg" style="padding:6px 0;text-align:right"></p></div>
    <div class="rel" id="rel"></div>
  </div>
</section>

<section id="site" class="v">
  <div class="bar2"><button onclick="history.back()">‹ رجوع</button><span id="su"></span><button onclick="show('home')">✕ إغلاق</button></div>
  <iframe id="fr" sandbox="allow-scripts allow-forms allow-popups"></iframe>
</section>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=p=>fetch('/api/x?'+new URLSearchParams(p)).then(r=>{if(!r.ok)throw 0;return r.json()});
/* ---------- intro ---------- */
'MALEK'.split('').forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.animationDelay=(.3+i*.18)+'s,'+(1.8+i*.15)+'s';$('#lg').appendChild(s)});
const cv=$('#c'),cx=cv.getContext('2d');let W,H,st=[],run=true,sp=2;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<260;i++)st.push({x:(Math.random()-.5)*W,y:(Math.random()-.5)*H,z:Math.random()*W});
(function f(){if(!run)return;cx.fillStyle='rgba(2,3,10,.35)';cx.fillRect(0,0,W,H);sp=Math.min(sp+.05,18);
st.forEach(s=>{s.z-=sp;if(s.z<=0){s.x=(Math.random()-.5)*W;s.y=(Math.random()-.5)*H;s.z=W}
const k=300/s.z,x=s.x*k+W/2,y=s.y*k+H/2,px=s.x*(300/(s.z+sp*3))+W/2,py=s.y*(300/(s.z+sp*3))+H/2;
cx.strokeStyle=`hsl(${190+s.z/W*90},100%,${60+k*10}%)`;cx.lineWidth=Math.min(k*1.6,3);cx.beginPath();cx.moveTo(px,py);cx.lineTo(x,y);cx.stroke()});
requestAnimationFrame(f)})();
function endIntro(){if(!run)return;$('#intro').classList.add('out');setTimeout(()=>{run=false;$('#intro').remove()},1000);$('#q').focus()}
setTimeout(endIntro,4800);$('#skip').onclick=endIntro;
/* ---------- nav ---------- */
function show(id,push){document.querySelectorAll('.v').forEach(v=>v.classList.toggle('on',v.id===id));$('#top').style.display=id==='home'?'none':'flex';
if(id==='home'){$('#watch video')&&($('#watch video').pause());$('#fr').src='about:blank'}scrollTo(0,0)}
const SITES={youtube:'yt','يوتيوب':'yt',wikipedia:'https://ar.wikipedia.org','ويكيبيديا':'https://ar.wikipedia.org',github:'https://github.com','جيت هاب':'https://github.com',reddit:'https://old.reddit.com','ريديت':'https://old.reddit.com',bbc:'https://www.bbc.com/arabic','بي بي سي':'https://www.bbc.com/arabic'};
$('#chips').innerHTML=['يوتيوب','ويكيبيديا','github','reddit','bbc'].map(n=>`<button onclick="go('${n}')">${n}</button>`).join('');
['q','q2'].forEach(i=>$('#'+i).addEventListener('keydown',e=>e.key==='Enter'&&go(e.target.value)));
function go(q){q=q.trim();if(!q)return;$('#q2').value=q;const k=q.toLowerCase(),m=q.match(/^(youtube|يوتيوب)\s+(.+)/i);
if(SITES[k]==='yt')return ytHome();if(m)return ytSearch(m[2]);if(SITES[k])return openSite(SITES[k]);
if(/^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q))return openSite(/^https?:/.test(q)?q:'https://'+q);search(q)}
/* ---------- videos ---------- */
const fmt=s=>s>0?(s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s%3600/60)).padStart(s>=3600?2:1,'0')+':'+String(s%60).padStart(2,'0'):'';
const card=(v,i)=>`<div class="vc" style="animation-delay:${i*40}ms" onclick="play('${v.id}')"><div class="th"><img loading="lazy" src="${esc(v.thumb)}" onerror="this.style.display='none'"><em>${fmt(v.dur)}</em></div><div><h4>${esc(v.title)}</h4><p>${esc(v.by)}</p></div></div>`;
const loading=()=>'<div class="msg"><div class="spin"></div>جارٍ التحميل…</div>';
async function ytHome(){show('res');$('#tw').style.display='none';$('#tv').className='on';$('#rb').innerHTML=loading();
try{const d=await api({a:'yt'});$('#rb').innerHTML='<div class="grid">'+d.map(card).join('')+'</div>'}catch(e){$('#rb').innerHTML='<div class="msg">❌ سيرفرات الفيديو مش بتستجيب دلوقتي، جرّب بعد شوية</div>'}}
async function ytSearch(q){show('res');$('#tw').style.display='';tab('v',q)}
async function play(id){show('watch');$('#pl').innerHTML=loading();$('#wt').textContent='';$('#rel').innerHTML='';
const fail=()=>{$('#pl').innerHTML=`<div class="msg" style="padding-top:10%">❌ سيرفر الفيديو مش بيستجيب دلوقتي<br><br><button style="background:var(--a);border:0;border-radius:99px;padding:10px 22px" onclick="play('${id}')">🔄 جرّب تاني</button><br><br><button style="background:none;border:1px solid var(--line);border-radius:99px;padding:6px 16px;color:var(--mut);font-size:12px" onclick="emb2('${id}')">تشغيل بديل (ممكن يظهر فيه إعلانات)</button></div>`};
try{const d=await api({a:'stream',id});$('#wt').textContent=d.title;$('#wb').textContent=d.by||'';
if(!d.url)fail();else{$('#pl').innerHTML=`<video controls autoplay playsinline src="${esc(d.url)}"></video>`;$('#pl video').onerror=fail}
$('#rel').innerHTML=d.related.slice(0,14).map(card).join('')}catch(e){fail()}}
function emb2(id){$('#pl').innerHTML=`<iframe allowfullscreen allow="autoplay;encrypted-media" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0"></iframe>`}
/* ---------- search ---------- */
let cur='';
function search(q){cur=q;show('res');$('#tw').style.display='';tab('w',q)}
async function tab(t,q){q=q||cur;cur=q;$('#tw').className=t==='w'?'on':'';$('#tv').className=t==='v'?'on':'';$('#rb').innerHTML=loading();
try{if(t==='w'){const d=await api({a:'web',q});$('#rb').innerHTML=d.length?d.map((r,i)=>`<div class="r" style="animation-delay:${i*50}ms" onclick="openSite('${esc(r.url).replace(/'/g,'%27')}')"><small>${esc(r.url)}</small><h3>${esc(r.title)}</h3><p>${esc(r.snip)}</p></div>`).join(''):'<div class="msg">مفيش نتائج</div>'}
else{const d=await api({a:'yt',q});$('#rb').innerHTML=d.length?'<div class="grid">'+d.map(card).join('')+'</div>':'<div class="msg">مفيش نتائج</div>'}}
catch(e){$('#rb').innerHTML='<div class="msg">❌ السيرفر مش بيستجيب دلوقتي، جرّب بعد شوية</div>'}}
/* ---------- in-site browser (ad-stripping proxy) ---------- */
function openSite(u){show('site');$('#su').textContent=u;$('#fr').src='/api/x?a=proxy&u='+encodeURIComponent(u);history.pushState({},'')}
addEventListener('message',e=>{if(e.data&&e.data.nav)openSite(e.data.nav)});
</script>
</body>
</html>
